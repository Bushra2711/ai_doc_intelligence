apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: documind
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: documind-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: documind-config
                  key: DATABASE_URL
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: documind-secrets
                  key: JWT_SECRET_KEY
            - name: MLFLOW_TRACKING_URI
              valueFrom:
                configMapKeyRef:
                  name: documind-config
                  key: MLFLOW_TRACKING_URI
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: uploads
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: documind
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
